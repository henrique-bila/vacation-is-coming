name: Test WhatsApp alert

on:
  workflow_dispatch:

jobs:
  test-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      - name: Send WhatsApp test message
        env:
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python -m src --test-whatsapp
